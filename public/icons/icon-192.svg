<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded edges -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6" />

  <!-- Car Silhouette / Grille Accent -->
  <path d="M 120 280 C 130 230, 180 180, 256 180 C 332 180, 382 230, 392 280 L 410 320 C 418 338, 404 356, 384 356 L 128 356 C 108 356, 94 338, 102 320 Z" fill="url(#accentGrad)" opacity="0.35" />
  
  <!-- CBR Monogram -->
  <text x="256" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="108" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">CBR</text>
  
  <!-- Subtitle Badge -->
  <rect x="136" y="310" width="240" height="44" rx="22" fill="url(#goldGrad)" />
  <text x="256" y="339" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="3">CARS BY RAJAT</text>

  <!-- Verified Shield Indicator -->
  <circle cx="256" cy="116" r="32" fill="url(#accentGrad)" />
  <path d="M 244 116 L 252 124 L 268 108" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
